[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beast-studio-client"
version = "1.0.0"
description = "Lightweight Python client for the Beast Studio local API"
requires-python = ">=3.10"
dependencies = ["requests>=2.28"]

[tool.setuptools.packages.find]
include = ["beast_studio_client*"]
