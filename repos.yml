# Repos this hub orchestrates. `scripts/sync_repos.ps1` clones/updates them as siblings
# of this repo's parent directory (C:\Users\techai\<name> by default).
# role: what the repo contributes to the design stack.

repos:
  - name: route-rush-unreal
    url: https://github.com/rblake2320/route-rush-unreal.git
    role: UE 5.6 arcade game — live proving ground for the game pipeline

  - name: mood-buddy
    url: https://github.com/rblake2320/mood-buddy.git
    role: photoreal companion avatar — proof of consistent-character recipe (PRIVATE)

  - name: Sand-Scape-codex-
    url: https://github.com/rblake2320/Sand-Scape-codex-.git
    role: modular sand-physics visual engine (ESM, 193 palettes)

  - name: sand-portrait
    url: https://github.com/rblake2320/sand-portrait.git
    role: photo-to-sand hourglass PWA (PRIVATE concept)

  - name: ai-content-engine
    url: https://github.com/rblake2320/ai-content-engine.git
    role: faceless multi-platform content pipeline — topic → YouTube long-form + shorts + thread + blog (local at D:\content\ai-content-engine)

  - name: vigil
    url: https://github.com/rblake2320/vigil.git
    role: vision-to-action platform — source of the hash-chained ledger pattern (studio/ledger.py) and the local→cloud reasoning cascade; shares the YOLO+VLM two-tier perception approach with the judge loop

external:
  - name: VibeUE
    url: https://github.com/kevinpbuckley/VibeUE.git
    role: UE MCP toolsets (MIT) — staged locally at ~\ue-plugins\VibeUE; copy into <UEProject>\Plugins\

  - name: hyperframes
    url: https://github.com/heygen-com/hyperframes.git
    role: HTML → deterministic video framework (Apache 2.0) — installed via `npx hyperframes skills update`, skills in ~\.claude\skills

  - name: Claude-Code-Frontend-Design-Toolkit
    url: https://github.com/wilwaldon/Claude-Code-Frontend-Design-Toolkit.git
    role: curated index of 70+ frontend-design tools for Claude Code — source of ui-ux-pro-max + context7 picks
