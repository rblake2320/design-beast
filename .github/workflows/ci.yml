name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    # windows runner — the studio is Windows-first (paths, process flags)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip install ruff
      - name: Ruff (fatal errors only)
        run: ruff check studio scripts --select E9,F63,F7,F82
      - name: Import smoke test
        run: python -m compileall studio scripts -q
      - name: Tests (live-GPU suites auto-deselected)
        run: python -m pytest -q
      - name: OpenAPI contract drift
        run: python scripts/generate_openapi.py --check

  typescript-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci || npm install
      - run: npm run typecheck
      - run: npm test
