name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    # Studio is Windows-first; exercise both supported Python runtimes.
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install and verify dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip check
      - name: Ruff (fatal errors)
        run: ruff check studio scripts sdk/python --select E9,F63,F7,F82
      - name: Import smoke test
        run: python -m compileall studio scripts sdk/python -q
      - name: Tests (live-GPU suites auto-deselected)
        run: python -m pytest -q --junitxml=python-tests.xml
      - name: OpenAPI contract drift
        run: python scripts/generate_openapi.py --check
      - name: Audit installed dependencies and retain SBOM
        run: python -m pip_audit -s osv --timeout 15 --progress-spinner off -f cyclonedx-json -o dependency-sbom.json
      - name: Build and install Python wheel
        run: |
          python -m build --wheel sdk/python --outdir .beast/package
          python -m pip install --no-deps --force-reinstall .beast/package/beast_studio_client-1.0.0-py3-none-any.whl
      - name: Execute shipped Studio and installed wheel
        run: python scripts/verify_runtime.py --output .beast/runtime
      - name: Retain test and distribution evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-${{ matrix.python }}-evidence
          path: |
            python-tests.xml
            dependency-sbom.json
            .beast/runtime/
            .beast/package/*.whl

  typescript-sdk:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["22", "24"]
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:package
      - run: npm audit --audit-level=high
