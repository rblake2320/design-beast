[pytest]
markers =
    live_gpu: hits the live Studio server and spawns REAL GPU generation jobs.
        Excluded by default — run intentionally with:  pytest -m live_gpu
        Never run while benchmarking or demoing (contaminates timings).
    live_desktop: subscribes to the live desktop (UIA / screen capture) and opens+closes its own
        Notepad window as an event driver. Excluded by default:  pytest -m live_desktop
addopts = -m "not live_gpu and not live_desktop"
